<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9ec4, #ff4d94);
    position: relative;
    overflow: visible; /* чтобы сердечки не обрезались */
}

.card {
    background: white;
    padding: 50px;
    border-radius: 25px;
    text-align: center;
    z-index: 1;
    position: relative;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 20px;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.1);
}

#yesBtn {
    background-color: hotpink;
    color: white;
}

#noBtn {
    background-color: gray;
    color: white;
    opacity: 0.3;
}

/* Сердечки на заднем плане */
.heart {
    position: absolute;
    width: 20px;
    height: 20px;
    background: red;
    transform: rotate(-45deg);
    animation: float 6s linear infinite;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background: red;
    border-radius: 50%;
}

.heart::before {
    top: -10px;
    left: 0;
}

.heart::after {
    left: 10px;
    top: 0;
}

@keyframes float {
    0% { transform: translateY(0) rotate(-45deg); opacity: 1;}
    100% { transform: translateY(-900px) rotate(-45deg); opacity: 0;}
}
</style>

<script>
// Создание сердечек на заднем плане
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    // Рандомно по горизонтали
    heart.style.left = Math.random() * window.innerWidth + "px";
    // Рандомно чуть ниже верхней границы, чтобы не обрезалось
    heart.style.top = 20 + Math.random() * 50 + "px";
    // Случайный размер
    const size = 15 + Math.random() * 25;
    heart.style.width = size + "px";
    heart.style.height = size + "px";
    heart.style.animationDuration = 4 + Math.random() * 4 + "s"; // разная скорость
    document.body.appendChild(heart);
    setTimeout(() => {
        heart.remove();
    }, 8000);
}

// Каждые 300ms появляется новое сердечко
setInterval(createHeart, 300);
</script>
