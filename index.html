<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine</title>
<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    background: pink;
    margin: 0;
}

.card {
    background: white;
    padding: 50px;
    border-radius: 20px;
    text-align: center;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 20px;
}

#yesBtn {
    background-color: hotpink;
    color: white;
}

#noBtn {
    background-color: gray;
    color: white;
    opacity: 0.3;
    position: relative;
}
</style>
</head>
<body>

<div class="card">
    <h1>Dear Efekan..<br>Will you be my Valentine? 💌</h1>
    <button id="yesBtn">YEAA 💖</button>
    <button id="noBtn">nah</button>
</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

yesBtn.onclick = () => {
    document.body.innerHTML = "<h1 style='color:white; text-align:center; margin-top:40vh;'>YAYYY 💖 I love you!!</h1>";
    document.body.style.background = "#ff4d94";
};

// Функция, чтобы кнопка "nah" убегала
function moveNo() {
    const x = Math.random() * 200 - 100; // ±100px от исходного положения
    const y = Math.random() * 50 - 25;   // ±25px
    noBtn.style.transform = translate(${x}px, ${y}px);
}

// Для мыши и для телефона
noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("click", moveNo);
</script>

</body>
</html>
