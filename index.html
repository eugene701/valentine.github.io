<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9ec4, #ff4d94);
    font-family: Arial, sans-serif;
}

.card {
    background: white;
    padding: 50px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    position: relative;
    width: 320px;
}

h1 {
    color: #ff2e7a;
}

.buttons {
    margin-top: 40px;
    position: relative;
    height: 120px;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    transition: 0.2s ease;
    position: absolute;
}

#yesBtn {
    background: hotpink;
    color: white;
    left: 20%;
}

#yesBtn:hover {
    transform: scale(1.1);
}

#noBtn {
    background: gray;
    color: white;
    opacity: 0.3;
    right: 20%;
}
</style>
</head>

<body>

    <div class="buttons">
        <button id="yesBtn">YEAA 💖</button>

    </div>
</div>
