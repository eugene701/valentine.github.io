<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine</title>
<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
    background: linear-gradient(135deg, #ff9ec4, #ff4d94);
    position: relative;
}

.card {
    background: white;
    padding: 50px;
    border-radius: 25px;
    text-align: center;
    z-index: 1;
    position: relative;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 20px;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.1);
}

#yesBtn {
    background-color: hotpink;
    color: white;
}

#noBtn {
    background-color: gray;
    color: white;
    opacity: 0.3;
}


.heart {
    position: absolute;
    width: 20px;
    height: 20px;
    background: red;
    transform: rotate(-45deg);
    animation: float 5s linear infinite;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background: red;
    border-radius: 50%;
}

.heart::before {
    top: -10px;
    left: 0;
}

.heart::after {
    left: 10px;
    top: 0;
}

@keyframes float {
    0% { transform: translateY(0) rotate(-45deg); opacity: 1;}
    100% { transform: translateY(-800px) rotate(-45deg); opacity: 0;}
}
</style>
</head>
<body>

<div class="card">
    <h1>Dear Efekan..<br>Will you be my Valentine? 💌</h1>
    <button id="yesBtn">YEAA 💖</button>
    <button id="noBtn">nah</button>
</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

// Сообщение при нажатии YEAA
yesBtn.onclick = () => {
    alert("I LOVE YOU 💖");
}

// Сообщение при нажатии nah
noBtn.onclick = () => {
    alert("Do you wanna be dead?");
}

// Создание сердечек на заднем плане
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.width = 20 + Math.random() * 20 + "px";
    heart.style.height = heart.style.width;
    document.body.appendChild(heart);
    setTimeout(() => {
        heart.remove();
    }, 5000);
}

// Каждые 300ms появляется новое сердечко
setInterval(createHeart, 300);
</script>

</body>
</html>
